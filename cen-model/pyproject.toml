[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cenmodel"
version = "1.0.0"
description = "Replication and probabilistic forecasting of the Polish imbalance price (CEN)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "lightgbm>=4.0", "scikit-learn>=1.3",
                "requests>=2.31", "pyyaml>=6.0"]

[project.scripts]
cenmodel = "cenmodel.cli:main"

[tool.setuptools]
packages = ["cenmodel"]
